[package]
name = "snap"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Screen annotation for agents: daemon, CLI, and overlay"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
fontdue = "0.9"
image = { version = "0.25", default-features = false, features = ["png"] }
png = "0.17"
tiny-skia = "0.11"
global-hotkey = "0.6"
gpui = { git = "https://github.com/zed-industries/zed", rev = "7a7c3e1d2f03195c5fa19bc890da330ad7f3abef" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "7a7c3e1d2f03195c5fa19bc890da330ad7f3abef", features = ["font-kit"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_op_in_unsafe_fn = "warn"
